upstream code-server-john {
  server 127.0.0.1:8443;
}

server {
     listen 443 ssl; 
     server_name john.example.com *.john.example.com;
     ssl_certificate /etc/nginx/conf.d/ssl/wildcard.john.example.com.crt; 
     ssl_certificate_key /etc/nginx/conf.d/ssl/wildcard.john.example.com.key;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2 TLSv1.3; 
     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
     ssl_prefer_server_ciphers on;

     location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://code-server-john;
     }
 }

 server {
    listen 80;
    server_name *.example.com;
    return 301 https://$host$request_uri;
 }
